# ============================================================
# HTTPS 配置（可选）：HTTP 自动跳转 HTTPS，并保留 /gpss/ 路径路由
# 使用前：
#   1) 把域名解析到服务器 IP，并用 certbot 或阿里云免费证书申请证书
#   2) 证书文件放到宿主机目录，如 /opt/certs/fullchain.pem、/opt/certs/privkey.pem
#   3) 修改 docker-compose.yml 的 nginx 服务：
#        - volumes 把 ./nginx.conf 换成 ./nginx-https.conf
#        - 增加证书挂载：/opt/certs:/etc/nginx/certs:ro
#        - 增加端口：- "${HTTPS_PORT:-443}:443"
# ============================================================

# HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS 主服务
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 设计作品上传可达 500MB
    client_max_body_size 500m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 半山学堂（根路径 /）
    location / {
        proxy_pass http://banshan-app:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 毕业设计管理系统（路径内嵌 /gpss/）
    location = /gpss {
        return 301 /gpss/;
    }

    location /gpss/ {
        proxy_pass http://gpss-app:3011/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
