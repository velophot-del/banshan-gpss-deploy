server {
    listen 80;
    server_name _;

    # 设计作品上传可达 500MB，统一放宽
    client_max_body_size 500m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ===== 半山学堂（前台 + 后台 CMS），挂在根路径 / =====
    location / {
        proxy_pass http://banshan-app:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ===== 毕业设计管理系统，路径内嵌在 /gpss/ =====
    # 无斜杠访问 /gpss 时重定向到 /gpss/
    location = /gpss {
        return 301 /gpss/;
    }

    # 末尾带斜杠的 proxy_pass 会把 /gpss/ 前缀剥除后交给 gpss-app：
    #   /gpss/            -> /
    #   /gpss/api/xxx     -> /api/xxx
    #   /gpss/assets/xxx  -> /assets/xxx
    #   /gpss/uploads/xxx -> /uploads/xxx
    location /gpss/ {
        proxy_pass http://gpss-app:3011/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
