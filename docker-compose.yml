# ============================================================
# 半山学堂 + 毕业设计管理系统（GPSS）统一部署（阿里云）
# 方法一：路径内嵌 —— /       -> 半山学堂
#                        /gpss/  -> 毕业设计管理系统
#
# 单 MySQL 实例（省内存）：一个 mysql:8.4 跑 banshan + gpss 两个库，
# 相比「两个 MySQL 各跑一库」能省掉一个 mysqld 进程（约 250~400MB），
# 更适合 1.8G 低配服务器。
#
# 用法：
#   1) cp .env.example .env 并填写
#   2) docker compose up -d --build
#   3) 访问 http://<服务器IP>/        → 半山学堂
#     访问 http://<服务器IP>/gpss/   → 毕业设计管理系统
# ============================================================

services:
  # ---------- 数据库：单实例，跑 banshan + gpss 两库 ----------
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    container_name: banshan-gpss-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${GPSS_DB_NAME:-gpss}          # 自动建 gpss 库并授权 app 用户
      MYSQL_USER: app                                # 应用连接账号（固定）
      MYSQL_PASSWORD: ${DB_PASSWORD:?请先设置 DB_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # ↓ 低配服务器内存调优（1.8G 内存必加，约省 200~300MB）
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --max-connections=100
      - --key-buffer-size=8M
      - --innodb-log-buffer-size=8M
      - --table-open-cache=2000
      - --innodb-flush-log-at-trx-commit=2
    volumes:
      - /opt/mysql:/var/lib/mysql
      # 首次初始化（数据目录为空）时执行，补建 banshan 库并给 app 授权
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - banshan-net

  # ---------- 应用：半山学堂 ----------
  banshan-app:
    build:
      context: ./banshan-academy
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    container_name: banshan-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3012
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:?请先设置 DB_PASSWORD}
      DB_NAME: ${BANSHAN_DB_NAME:-banshan}
      USE_SOCKET: 'false'
      DB_CREATE_IF_MISSING: 'true'
      JWT_SECRET: ${BANSHAN_JWT_SECRET:?请先设置 BANSHAN_JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${PUBLIC_URL:?请先设置 PUBLIC_URL}
      UPLOAD_DIR: /data/uploads
      CASE_PRIVATE_DIR: /data/case-private
      GPSS_URL: /gpss/
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - /opt/banshan/uploads:/data/uploads
      - /opt/banshan/case-private:/data/case-private
    networks:
      - banshan-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3012/api/health').then(r=>{ if(!r.ok) process.exit(1) }).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ---------- 应用：毕业设计管理系统 ----------
  gpss-app:
    build:
      context: ./gpss
      dockerfile: deployment/aliyun/Dockerfile
    restart: unless-stopped
    container_name: gpss-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3011
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:?请先设置 DB_PASSWORD}
      DB_NAME: ${GPSS_DB_NAME:-gpss}
      USE_SOCKET: 'false'
      DB_CREATE_IF_MISSING: 'true'   # 启动时自动建库建表（幂等）
      JWT_SECRET: ${GPSS_JWT_SECRET:?请先设置 GPSS_JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      ENABLE_DEMO_LOGIN: 'false'
      FRONTEND_URL: ${PUBLIC_URL:?请先设置 PUBLIC_URL}
      UPLOAD_DIR: /data/uploads
      # 关键：内嵌到 /gpss/ 子路径，返回给前端的 URL（如 /gpss/uploads/...）需加此前缀
      PUBLIC_BASE_PATH: /gpss
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - /opt/gpss/uploads:/data/uploads
    networks:
      - banshan-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3011/api/health').then(r=>{ if(!r.ok) process.exit(1) }).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ---------- 统一入口：Nginx ----------
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    container_name: banshan-nginx
    depends_on:
      banshan-app:
        condition: service_healthy
      gpss-app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      # 启用 HTTPS 时取消下一行注释（并按下方的 HTTPS 说明改 volumes）
      # - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 启用 HTTPS 时：把上面 ./nginx.conf 换成 ./nginx-https.conf，
      # 并取消下面证书挂载的注释（证书放到宿主机 /opt/certs/）
      # - /opt/certs:/etc/nginx/certs:ro
    networks:
      - banshan-net

networks:
  banshan-net:
    driver: bridge
